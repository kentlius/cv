          - 全国Capstone Projectコンペティションの600チーム以上の中で上位10位に入賞
      - institution: CBSテクノ
        area: 日本語学習
        start_date: 2025-01
        end_date: 2025-06
        location: 名古屋, 日本
        highlights:
          - 集中型のビジネス日本語トレーニングプログラムを修了
    受賞歴:
      - name: Bangkit Capstone Project - AI活用ヨガポーズ検出アプリケーション
        date: 2024-01
        summary: 全国600チーム以上の中で上位10位
        highlights:
          - コンピュータビジョンを用いた、リアルタイムのヨガポーズ検出と姿勢の補正フィードバック機能を備えたモバイルアプリケーションを開発。
          - 本番環境に近いGoogle Cloud Platformの制約の下で、MLを活用した製品をエンドツーエンドで納品。
      - name: Digihatch Hackathon [(Dexa Group)](https://www.dexagroup.com/) - インテリジェント物流最適化システム
        date: 2023-11
        location: ジャカルタ, インドネシア
        summary: 2位入賞
        highlights:
          - 医薬品卸売向けの輸送管理システムの設計・開発を主導し、複数ノード配送および経路制約に対応。
          - 車両経路問題（VRP）のアプローチによる経路最適化を実装し、輸送中の重要な環境条件を監視するリアルタイムのMQTTベース監視システムを構築。
