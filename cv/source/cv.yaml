# Source of truth for the RenderCV documents.  `scripts/build_cv.py` expands this
# file into Kent_Liusudarso_CV.yaml (en) and Kent_Liusudarso_CV_ja.yaml (ja); edit
# this file, never the generated ones.
#
# - `shared` holds the facts both locales state identically.
# - A section entry field is either a plain scalar (byte-identical in every
#   locale) or a `{en, ja}` mapping (translated).  `highlights` is always
#   `{en: [...], ja: [...]}`.
# - A locale's `design`/`settings` state only what differs from `shared`.
schema: https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.8/schema.json
shared:
  name: Kent Liusudarso
  email: kent.liusudarso@gmail.com
  phone: +81-70-1513-6395
  social_networks:
    - network: LinkedIn
      username: kentlius
    - network: GitHub
      username: kentlius
  design:
    theme: sb2nov
    page:
      size: a4
  settings:
    current_date: today
    render_command:
      output_folder: rendercv_output
      dont_generate_html: true
      dont_generate_png: true
sections:
  - titles:
      en: experience
      ja: 職歴
    entries:
      - company:
          en: Toyota Motor East Japan
          ja: トヨタ自動車東日本株式会社
        position:
          en: Software Engineer
          ja: ソフトウェアエンジニア
        start_date: 2025-08
        end_date: present
        location:
          en: Shizuoka, Japan
          ja: 静岡県, 日本
        highlights:
          en:
            - Lead a cross-company initiative with Toyota Motor Corporation to centralize design requirement data from multiple sources, establishing the first governance framework for approving external data source access, a request with no existing precedent or policy.
            - Built the company's first dedicated development environment on fully air-gapped infrastructure, deploying Proxmox virtualization, GitLab, and containerized application and database hosting to replace shared-NAS code storage with traceable source control and coordinated releases.
            - Reverse-engineered undocumented legacy system APIs and built a recurring ETL pipeline ingesting 500,000+ manufacturing bill-of-materials records per run, applying Slowly Changing Dimensions to track historical versions, reducing end-to-end processing from 8 hours to 10 minutes (97.9%).
            - Rebuilt deformable-object manipulation for physical AI after 1,000 manually teleoperated imitation-learning episodes failed to yield an accurate policy, cutting manual demonstrations to 10 and extrapolating synthetic motion trajectories with NVIDIA GR00T-Mimic in Isaac Lab.
          ja:
            - トヨタ自動車株式会社との会社横断的な取り組みを主導し、分散していた複数の情報源の設計要件データを集約して一元管理する基盤を構築した。外部データソースへのアクセス承認については既存の先例も方針も存在しない中、初めてとなるガバナンス体制を確立した。
            - 完全エアギャップ環境の上に初の専用開発環境を構築した。Proxmoxによる仮想化、GitLab、およびコンテナによるアプリケーション・データベースのホスティングを導入し、共有NASでのコード保管から、追跡可能なソースコード管理と整合性のあるリリース運用へ移行した。
            - ドキュメントが存在しない基幹システムAPIをリバースエンジニアリングし、1回の実行で50万件以上の製造BOM（部品表）データを取り込む定期実行ETLパイプラインを構築した。Slowly Changing Dimensionsを適用して履歴バージョンを追跡可能とし、エンドツーエンドの処理時間を8時間から10分へ短縮した（97.9%短縮）。
            - 手動テレオペレーションによる1,000回の模倣学習エピソードでは十分な精度のポリシーが得られなかったため、フィジカルAI向けの変形物体操作タスクを再構築した。Isaac Lab上でNVIDIA GR00T-Mimicを用いて合成した動作軌跡を補間することで、手動デモストレーションを10回まで削減した。
      - company: PT Kalbe Farma Tbk
        position:
          en: Software Engineer Intern
          ja: ソフトウェアエンジニア（インターン）
        start_date: 2024-03
        end_date: 2024-09
        location:
          en: Remote
          ja: リモート
        highlights:
          en:
            - Designed and implemented a FHIR-based interoperability layer as a reusable foundation for integrating third-party hospital systems, replacing bespoke per-hospital API schemas with a standardized healthcare data model.
            - Redesigned the RIS-HIS integration architecture connecting radiology information systems with hospital information systems, standardizing clinical data exchange across hospital platforms and defining explicit request, validation, and transformation stages to improve traceability of healthcare data processing.
          ja:
            - 第三者病院システムの連携基盤として再利用できるFHIRベースの相互運用レイヤーを設計・実装し、病院ごとに個別に構築されていたAPIスキーマを、標準化された医療データモデルに置き換えた。
            - 画像情報システム（RIS）と病院情報システム（HIS）を接続するRIS-HIS連携アーキテクチャを再設計し、病院プラットフォーム間の臨床データ授受を標準化した。また、リクエスト・バリデーション・変換の各段階を明示的に定義し、医療データ処理のトレーサビリティを向上させた。
      - company: PT Bank Central Asia Tbk (BCA)
        position:
          en: Application Developer Intern
          ja: アプリケーション開発エンジニア（インターン）
        start_date: 2023-06
        end_date: 2023-11
        location:
          en: Tangerang, Indonesia
          ja: タンゲラン, インドネシア
        highlights:
          en:
            - Developed low-level monitoring agents in C/C++ that collect sensor telemetry and software inventory data across BCA's nationwide ATM fleet, enabling earlier detection of device issues before customer impact.
            - Built an internal ATM hardware inventory dashboard consolidating maintenance status and device information, displayed on live wallboard screens in the operations office.
          ja:
            - BCAの全国ATMネットワークからセンサーデータとソフトウェア資産情報を収集する低レベル監視エージェントをC/C++で開発した。端末の異常を顧客影響が生じる前に検知できるようにした。
            - ATMのハードウェア資産情報をメンテナンス状況と併せて集約する社内ダッシュボードを構築し、運用室の大型表示画面でのリアルタイム表示に対応した。
      - company: School of Electrical Engineering and Informatics ITB (STEI ITB)
        position:
          en: System Administrator
          ja: システム管理者
        start_date: 2022-09
        end_date: 2024-08
        location:
          en: Bandung, Indonesia
          ja: バンダン, インドネシア
        highlights:
          en:
            - Scaled the university's Moodle platform to support 10,000+ concurrent students during the university entrance examination, validating capacity through JMeter load testing and performance tuning ahead of the live event.
            - Automated configuration management for the university's laboratory workstation fleet using Ansible, standardizing system provisioning, configuration baselines, and security controls.
          ja:
            - 大学入学試験における1万人以上の同時アクセスに対応するため、学内のMoodleプラットフォームをスケールアウトした。本番稼働前にJMeterによる負荷試験とパフォーマンスチューニングを実施し、処理能力を検証した。
            - 学内研究室のワークステーション群に対し、Ansibleを用いた設定管理の自動化を推進し、システムのプロビジョニング、設定基準、セキュリティ対策を標準化した。
      - company: PT Indojaya Mitra Sarana (IMS Automation)
        position:
          en: Software Engineer Intern
          ja: ソフトウェアエンジニア（インターン）
        start_date: 2022-06
        end_date: 2022-08
        location:
          en: Tangerang, Indonesia
          ja: タンゲラン, インドネシア
        highlights:
          en:
            - Engineered an Open Charge Point Protocol (OCPP) server to support remote control, monitoring, and testing of EV charging stations.
            - Built a web-based EV charging platform covering charger discovery, charging-session management, and customer-facing station workflows, integrated with Xendit payment APIs for authenticated charging transactions.
          ja:
            - EV充電ステーションの遠隔制御・監視・試験に対応するため、Open Charge Point Protocol（OCPP）サーバーを設計・実装した。
            - 充電器の検索、充電セッション管理、顧客向けステーション操作を網羅するWebベースのEV充電プラットフォームを構築し、Xenditの決済APIと連携して認証付きの充電決済を実現した。
