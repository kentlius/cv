            - Delivered an end-to-end ML-powered product under production-like Google Cloud Platform constraints.
          ja:
            - コンピュータビジョンを用いた、リアルタイムのヨガポーズ検出と姿勢の補正フィードバック機能を備えたモバイルアプリケーションを開発。
