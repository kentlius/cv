name: Release a CV

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  call_rendercv_workflow:
    name: RenderCV
    uses: ./.github/workflows/rendercv.yaml

  build:
    needs: call_rendercv_workflow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download RenderCV Output
        uses: actions/download-artifact@v4
        with:
          name: RenderCV Output
          path: cv/rendercv_output
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cv/rendercv_output/*_CV.pdf
            cv/rendercv_output/*_CV.typ
          generate_release_notes: true
          make_latest: true
