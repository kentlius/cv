name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: apps/web (astro)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  cv:
    name: cv (rendercv)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cv
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version-file: .python-version
          enable-cache: true
          cache-dependency-glob: "cv/uv.lock"
      - run: uv sync --frozen
      - name: Smoke test rendercv
        run: |
          shopt -s nullglob
          cv_files=(*_CV*.yaml)
          if [ ${#cv_files[@]} -eq 0 ]; then
            echo "No RenderCV file found!"
            exit 1
          fi
          for cv_file in "${cv_files[@]}"; do
            uv run rendercv render "$cv_file"
          done
          test -f rendercv_output/Kent_Liusudarso_CV.pdf
          test -f rendercv_output/Kent_Liusudarso_CV_ja.pdf
